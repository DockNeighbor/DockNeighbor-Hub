# CI for both collector tiers. The steps are carried over from the app repo's ci.yml so nothing
# regresses in the move — the hub-lite job's pinned shellcheck and the ar-less .ipk build both exist
# because of failures documented there.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # hub-lite (hub-lite/): POSIX-sh parser tests with hardware-captured fixtures, plus shellcheck at
  # error severity. dash (ubuntu's sh) doubles as a busybox-ash POSIX check.
  hub-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hub-lite parser tests
        run: sh hub-lite/test.sh
      - name: Install shellcheck
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          echo "/tmp/shellcheck-${SC_VERSION}" >> "$GITHUB_PATH"
      - name: Shellcheck
        # daemon/macos/postinstall is in this list because it SHIPS INSIDE THE RELEASED PKG and
        # runs as root on a customer's machine. It was omitted while it lived only in the daemon
        # tree — the same blind spot that let a broken NSIS script ship: a thing that is built but
        # never checked.
        #
        # hub-lite-cgi.sh was missing from this list until 2026-08-31, and it is the WEBHOOK
        # RECEIVER — the script that turns a Shelly's flood report into a local valve close. The
        # blind spot the note above describes had claimed another one. hub-lite-api.sh is new in
        # the same commit and went straight in, rather than waiting to be noticed later.
        run: shellcheck --severity=error --shell=sh hub-lite/brvg-hub-lite.sh hub-lite/hub-lite-mgmt.sh hub-lite/hub-lite-cgi.sh hub-lite/hub-lite-api.sh hub-lite/setup-usb-gps.sh hub-lite/test.sh hub-lite/package/build-ipk.sh hub-lite/package/build-feed.sh hub-lite/package/feed-setup.sh hub-lite/hub/install.sh daemon/linux/install.sh daemon/macos/postinstall
      - name: Build hub-lite package
        run: sh hub-lite/package/build-ipk.sh
      # The feed index is the signed artifact: prove the index describes the package just built,
      # and that the builder REFUSES to emit an unsigned feed unless explicitly overridden.
      - name: Build hub-lite feed index (and prove it refuses to go unsigned)
        run: |
          ALLOW_UNSIGNED=1 sh hub-lite/package/build-feed.sh
          grep -q '^SHA256sum: ' dist/Packages
          grep -q "^Version: $(sed -n 's/^HUB_LITE_VERSION="\([^"]*\)".*/\1/p' hub-lite/brvg-hub-lite.sh)" dist/Packages
          if sh hub-lite/package/build-feed.sh >/dev/null 2>&1; then
            echo "build-feed.sh produced an UNSIGNED feed without ALLOW_UNSIGNED" >&2
            exit 1
          fi

  # The Rust hub daemon (daemon/) — completely standalone by ruling (owner 2026-08-19): its own
  # build, its own CI, its own releases. The desktop app never compiles it; it downloads a pinned,
  # already-built release artifact.
  # WINDOWS IS A SEPARATE JOB BECAUSE THE DAEMON REPO SHIPS WINDOWS-ONLY CODE.
  #
  # `brvg-hub-tray` draws in the notification area and drives the SCM (sc.exe), so none of it compiles on
  # the Linux leg below — it is a stub there. Without this job its first real compile would happen
  # inside a release, which is precisely the mistake that shipped a broken installer in
  # daemon-v0.3.0: the only gate was a Linux one, and the Windows-specific half went out unbuilt.
  #
  # Free: brvg-hub is a public repo, so GitHub-hosted Windows minutes are not billed.
  daemon-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # --bins, not --lib: building the library alone would skip the tray binary entirely and this
      # job would pass while proving nothing about the thing it exists to check.
      - run: cargo build --bins
      - run: cargo test

  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release

      # Compile the Windows installer script on every push. It only SHIPS from a daemon-v* tag, so
      # without this its first compile would be inside a release — the worst place to discover a
      # typo. makensis cross-builds on Linux, so this costs seconds.
      #
      # -WX (WARNINGS ARE ERRORS) IS THE LOAD-BEARING FLAG HERE, not -V2.
      # NSIS does not fail on an unknown $VARIABLE. It warns, DROPS the token, and produces a
      # perfectly valid installer that silently does the wrong thing. daemon-v0.3.0 shipped exactly
      # that: four `warning 6000: unknown variable/constant "PROGRAMDATA..."` lines sat in the green
      # release log while the installer targeted \BoatRVGuardian instead of C:\ProgramData\... and
      # its silent uninstall deleted nothing. This gate compiled it and passed, because compiling
      # was all it checked. A warning NSIS can recover from is precisely the kind this project
      # cannot afford, since nobody re-reads a green log.
      - name: Windows installer script compiles
        run: |
          # See daemon-release.yml: a flaky google-chrome apt source on the runner makes
          # `apt-get update` fail intermittently; drop it so nsis (in universe) still installs.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo apt-get update -qq || true
          sudo apt-get install -y nsis
          cp target/release/brvg-hub windows/brvg-hub.exe
          # The installer also embeds the tray monitor, so the gate needs a file at that name or
          # makensis fails on a missing File. Same Linux-ELF-wearing-a-.exe trick as above: this
          # proves the SCRIPT compiles, and the daemon-windows job proves the binary does.
          cp target/release/brvg-hub-tray windows/brvg-hub-tray.exe
          makensis -WX -V2 windows/installer.nsi
          test -f windows/brvg-hub-windows-setup.exe
          echo "installer built: $(stat -c%s windows/brvg-hub-windows-setup.exe) bytes"
